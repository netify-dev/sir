url: https://netify-dev.github.io/sir/
template:
  bootstrap: 5

navbar:
  structure:
    left:  [methodology, paper, articles, reference]
    right: [search, github]
  components:
    methodology:
      text: Methodology
      href: articles/methodology.html
    paper:
      text: Paper
      href: sir_manuscript.pdf

articles:
  - title: "Getting Started"
    navbar: ~
    contents:
    - sir_overview
    - sir_inference
    - sir_extensions
  - title: "Methods Reference"
    contents:
    - methodology

reference:
  - title: "Model Fitting"
    desc: "Fit Social Influence Regression models to network data"
    contents:
    - sir

  - title: "S3 Methods"
    desc: "Standard R methods for sir model objects"
    contents:
    - coef.sir
    - vcov.sir
    - confint.sir
    - nobs.sir
    - fitted.sir
    - residuals.sir
    - logLik.sir
    - AIC.sir
    - BIC.sir
    - predict.sir
    - summary.sir
    - print.sir
    - print.summary.sir
    - plot.sir_fit
    - tidy.sir
    - glance.sir
    - augment.sir

  - title: "Visualization"
    desc: "Network visualization of influence matrices"
    contents:
    - plot_sir_network

  - title: "Bootstrap & Inference"
    desc: "Bootstrap standard errors and robust inference"
    contents:
    - boot_sir
    - print.boot_sir
    - summary.boot_sir
    - confint.boot_sir

  - title: "Forecasting & Scoring"
    desc: "Forecast held-out networks and score predictions"
    contents:
    - forecast.sir_fit
    - cv_sir
    - print.sir_cv
    - score_sir

  - title: "Model-Implied Scenarios"
    desc: "Build scenario arrays for prediction"
    contents:
    - get_scen_vals
    - get_scen_array

  - title: "Simulation & Data Preparation"
    desc: "Simulate network data and prepare inputs for SIR models"
    contents:
    - sim_sir
    - icews
    - rel_covar
    - cast_array
